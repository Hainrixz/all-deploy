name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test deps
        run: pip install pytest

      - name: Validate SKILL.md
        run: python3 tests/validate_skill.py .

      - name: Syntax-check scripts
        run: |
          python3 -m py_compile scripts/audit.py
          python3 -m py_compile scripts/env_extract.py
          python3 -m py_compile scripts/static_check.py
          python3 -m py_compile scripts/sync_cowork_plugin.py
          python3 -m py_compile tests/validate_skill.py

      - name: Run test suite
        run: python3 -m pytest tests/ -v

      - name: Sanity-check self-audit (scoped, no CVEs)
        run: python3 scripts/audit.py . --scoped --skip-cve

      # The static profile runs on Linux here, where the filesystem is
      # case-sensitive — the opposite of the Mac most contributors use. That
      # difference is the whole point of static.asset.case-mismatch, so it is
      # worth exercising the path on both.
      - name: Sanity-check static profile
        run: |
          mkdir -p /tmp/static-fixture
          printf '<!doctype html><html lang="en"><head><meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>t</title><meta name="description" content="t">\n<meta property="og:title" content="t"><meta property="og:image" content="https://e/p.png">\n</head><body>ok</body></html>' > /tmp/static-fixture/index.html
          python3 scripts/audit.py /tmp/static-fixture --profile static

      - name: Check the Cowork plugin has not drifted from its sources
        run: python3 scripts/sync_cowork_plugin.py --check
